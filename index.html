<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MedTrack — because health matters</title>
<style>
:root{--deep:#0b3337;--deep2:#103f42;--teal:#72d9d0;--teal2:#078f96;--muted:#a8d0cc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--deep);color:white;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.intro{min-height:100vh;display:grid;place-items:center;position:relative;isolation:isolate;background:radial-gradient(circle at 50% 43%,#185357 0,#0b3337 48%,#08282c 100%)}.grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(#6fd0c8 1px,transparent 1px),linear-gradient(90deg,#6fd0c8 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,black,transparent 70%)}.orb{position:absolute;border-radius:50%;border:1px solid rgba(114,217,208,.28);animation:orbit 15s linear infinite}.orb:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 8px rgba(114,217,208,.12)}.orb.one{width:460px;height:460px}.orb.one:after{left:53px;top:74px}.orb.two{width:330px;height:330px;animation-duration:11s;animation-direction:reverse}.orb.two:after{right:28px;bottom:62px;background:#ef8560;box-shadow:0 0 0 8px rgba(239,133,96,.12)}.orb.three{width:220px;height:220px;animation-duration:8s}.orb.three:after{right:15px;top:31px}.content{text-align:center;position:relative;z-index:2;animation:appear 1s ease both}.logo-wrap{width:105px;height:105px;margin:0 auto 24px;border-radius:32px;background:linear-gradient(145deg,#91ebe0,#53c9c2);display:grid;place-items:center;color:var(--deep);font:700 58px Georgia,serif;box-shadow:0 0 0 0 rgba(114,217,208,.5);animation:logoIn .9s ease both,pulse 2.2s 1s infinite}.name{font:700 42px Georgia,serif;letter-spacing:-1.5px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);margin-top:7px}.message{color:#b4d7d3;font-size:13px;margin-top:30px;min-height:20px}.bar{width:190px;height:3px;background:#245b5e;border-radius:8px;overflow:hidden;margin:18px auto 0}.bar i{display:block;width:42%;height:100%;border-radius:8px;background:var(--teal);animation:loading 2.1s ease-in-out infinite}.skip{display:inline-block;color:#9bc5c1;font-size:11px;margin-top:25px;text-decoration:none;border-bottom:1px solid rgba(155,197,193,.45);padding-bottom:2px}.skip:hover{color:white}.corner{position:absolute;bottom:27px;left:0;right:0;text-align:center;color:#719997;font-size:10px;letter-spacing:.06em;z-index:2}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes logoIn{from{opacity:0;transform:scale(.55) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(114,217,208,.45)}50%{box-shadow:0 0 0 20px rgba(114,217,208,0)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes loading{0%{transform:translateX(-160%)}100%{transform:translateX(480%)}}@media(max-width:600px){.orb.one{width:350px;height:350px}.orb.two{width:260px;height:260px}.orb.three{width:170px;height:170px}.name{font-size:36px}.logo-wrap{width:88px;height:88px;font-size:49px}}
</style>
</head>
<body><main class="intro"><div class="grid"></div><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div><div class="content"><div class="logo-wrap">M</div><div class="name">MedTrack</div><div class="tag">because health matters</div><div class="message" id="message">Connecting your care journey…</div><div class="bar"><i></i></div><a class="skip" href="login.html">Continue to login</a></div><div class="corner">A connected health record · Team Bazinga</div></main><script>setTimeout(()=>{document.querySelector('#message').textContent='Opening secure demo access…'},850);setTimeout(()=>{window.location.replace('login.html')},2300);</script></body>
